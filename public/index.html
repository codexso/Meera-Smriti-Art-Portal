<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meera Smriti Sishu Ankan Siksha Kendra | Welcome Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #020617; color: #fff; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; }
    #splashCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    .splash-orb { transition: all 0.3s ease; box-shadow: 0 0 20px rgba(255,255,255,0.05); }
    .splash-orb:hover { transform: scale(1.15); box-shadow: 0 0 30px var(--hover-color); }
  </style>
</head>
<body class="flex items-center justify-center h-screen relative">
  <canvas id="splashCanvas"></canvas>
  <div class="relative z-20 w-full max-w-4xl h-[500px] flex items-center justify-center p-4">
    <div class="text-center z-30 px-8 py-6 rounded-lg border border-slate-800 bg-slate-950/80 backdrop-blur-sm shadow-2xl">
      <div class="w-16 h-16 bg-orange-600 rounded-full mx-auto flex items-center justify-center text-white text-2xl mb-4 shadow-lg border-2 border-slate-800">
        <i class="fa-solid fa-landmark"></i>
      </div>
      <h1 class="text-2xl md:text-4xl font-serif text-white uppercase tracking-wider mb-2">
        Meera Smriti Sishu<br>Ankan Siksha Kendra
      </h1>
      <div class="w-24 h-1 bg-orange-500 mx-auto mb-4"></div>
      <p class="text-slate-400 text-xs font-semibold tracking-widest uppercase mb-6">Select Portal Color Interface & Enter</p>
      <a href="main.html" class="inline-block bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs uppercase px-6 py-2.5 rounded shadow tracking-widest transition-colors">
        Proceed to Portal <i class="fa-solid fa-arrow-right ml-1"></i>
      </a>
    </div>

    <button onclick="triggerColorSpill('#ea580c', '#c2410c', '#ffedd5')" class="splash-orb absolute top-4 left-1/2 -translate-x-1/2 w-16 h-16 rounded-full bg-orange-600 border-4 border-slate-900 focus:outline-none flex items-center justify-center group cursor-pointer" style="--hover-color: #ea580c;">
      <span class="opacity-0 group-hover:opacity-100 absolute -bottom-6 text-[10px] text-white font-bold tracking-widest uppercase transition-opacity">Saffron</span>
    </button>
    <button onclick="triggerColorSpill('#0284c7', '#0369a1', '#e0f2fe')" class="splash-orb absolute bottom-4 left-1/2 -translate-x-1/2 w-16 h-16 rounded-full bg-sky-600 border-4 border-slate-900 focus:outline-none flex items-center justify-center group cursor-pointer" style="--hover-color: #0284c7;">
      <span class="opacity-0 group-hover:opacity-100 absolute -top-6 text-[10px] text-white font-bold tracking-widest uppercase transition-opacity">Navy</span>
    </button>
    <button onclick="triggerColorSpill('#e11d48', '#be123c', '#ffe4e6')" class="splash-orb absolute left-4 md:left-12 top-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-rose-600 border-4 border-slate-900 focus:outline-none flex items-center justify-center group cursor-pointer" style="--hover-color: #e11d48;">
      <span class="opacity-0 group-hover:opacity-100 absolute -right-16 text-[10px] text-white font-bold tracking-widest uppercase transition-opacity">Crimson</span>
    </button>
    <button onclick="triggerColorSpill('#16a34a', '#15803d', '#dcfce7')" class="splash-orb absolute right-4 md:right-12 top-1/2 -translate-y-1/2 w-16 h-16 rounded-full bg-green-600 border-4 border-slate-900 focus:outline-none flex items-center justify-center group cursor-pointer" style="--hover-color: #16a34a;">
      <span class="opacity-0 group-hover:opacity-100 absolute -left-16 text-[10px] text-white font-bold tracking-widest uppercase transition-opacity">Emerald</span>
    </button>
    <button onclick="triggerColorSpill('#7c3aed', '#6d28d9', '#ede9fe')" class="splash-orb absolute top-16 right-16 md:top-24 md:right-32 w-16 h-16 rounded-full bg-violet-600 border-4 border-slate-900 focus:outline-none flex items-center justify-center group cursor-pointer" style="--hover-color: #7c3aed;">
      <span class="opacity-0 group-hover:opacity-100 absolute -bottom-6 text-[10px] text-white font-bold tracking-widest uppercase transition-opacity">Purple</span>
    </button>
  </div>

  <script>
    const THEME_KEY = 'meera_smriti_org_theme';
    function triggerColorSpill(brandColor, brandDark, brandLight) {
      const canvas = document.getElementById('splashCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      let radius = 0;
      const maxRadius = Math.sqrt(Math.pow(canvas.width, 2) + Math.pow(canvas.height, 2));
      function animateSpill() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, radius, 0, Math.PI * 2);
        ctx.fillStyle = brandColor;
        ctx.fill();
        ctx.closePath();
        radius += 45;
        if (radius < maxRadius) {
          requestAnimationFrame(animateSpill);
        } else {
          localStorage.setItem(THEME_KEY, JSON.stringify({ brandColor, brandDark, brandLight }));
          window.location.href = 'main.html';
        }
      }
      animateSpill();
    }
  </script>
</body>
</html>
