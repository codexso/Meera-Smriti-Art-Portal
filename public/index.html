<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Meera Smriti</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-nav">
        <h2>🎨 Meera Smriti Siksha Kendra</h2>
        <div class="social-badges">
            <a href="https://www.youtube.com/@meerasmriti5551" target="_blank">YouTube</a>
            <a href="https://www.instagram.com/meerasmriti/?hl=en" target="_blank">Instagram</a>
        </div>
    </header>

    <div class="dashboard-container">
        <!-- Admission Form -->
        <div class="card">
            <h3>📝 New Admission</h3>
            <form id="admissionForm">
                <div class="input-group">
                    <input type="text" id="studentName" placeholder="Artist Name" required>
                </div>
                <div class="input-group">
                    <input type="text" id="courseName" placeholder="Batch / Course Level" required>
                </div>
                <button type="submit" class="btn-primary">Register Student</button>
            </form>
        </div>

        <!-- Database List -->
        <div class="card">
            <h3>🗄️ Active Roster</h3>
            <ul class="student-list" id="dbList">
                <!-- Javascript will inject items here -->
            </ul>
        </div>
    </div>

    <!-- Frontend Logic -->
    <script src="js/app.js"></script>
</body>
</html>
