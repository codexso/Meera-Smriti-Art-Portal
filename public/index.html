<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access | Meera Smriti Siksha Kendra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: '#ea580c', 'brand-dark': '#c2410c' }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090d16; color: #f8fafc; }
    .bold-card { background: linear-gradient(145deg, #0f172a, #1e293b); }
    .glow-orange { box-shadow: 0 0 30px rgba(234, 88, 12, 0.25); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Decorative Blur -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-orange-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-amber-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full z-10">
    
    <!-- Branding Header -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-2xl flex items-center justify-center mx-auto text-white text-2xl shadow-lg glow-orange mb-4">
        <i class="fa-solid fa-graduation-cap"></i>
      </div>
      <h1 class="text-2xl md:text-3xl font-black uppercase tracking-tight text-white">
        Meera Smriti <span class="text-orange-500">Siksha Kendra</span>
      </h1>
      <p class="text-xs text-slate-400 font-semibold tracking-wider uppercase mt-1">Fine Arts & Cultural Academy</p>
      <p class="text-[11px] text-orange-400 font-mono mt-1"><i class="fa-solid fa-phone mr-1"></i> HQ Line: 82749 40238</p>
    </div>

    <!-- Auth Module Container -->
    <div class="bold-card border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-lg">
      
      <!-- Multi-Tab Switcher -->
      <div class="grid grid-cols-3 gap-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800 mb-6 text-center text-xs font-bold uppercase tracking-wider">
        <button id="tabLoginBtn" onclick="switchTab('login')" class="py-2.5 rounded-lg text-white bg-orange-600 transition-all cursor-pointer">
          Login
        </button>
        <button id="tabRegisterBtn" onclick="switchTab('register')" class="py-2.5 rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer">
          Register
        </button>
        <button id="tabAdminBtn" onclick="switchTab('admin')" class="py-2.5 rounded-lg text-amber-500 hover:text-amber-400 transition-all cursor-pointer">
          <i class="fa-solid fa-lock mr-1"></i> Admin
        </button>
      </div>

      <!-- User Login Form -->
      <form id="loginForm" onsubmit="handleUserLogin(event)" class="space-y-4">
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1 tracking-wider">Email or Student ID</label>
          <input type="text" id="loginUser" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500 font-medium" placeholder="student@meerasmriti.org">
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1 tracking-wider">Password</label>
          <input type="password" id="loginPass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500 font-mono" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg uppercase tracking-widest text-xs transition-colors shadow-lg cursor-pointer">
          Access Portal <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
        </button>
      </form>

      <!-- Student Registration Form -->
      <form id="registerForm" onsubmit="handleUserRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1 tracking-wider">Full Candidate Name</label>
          <input type="text" id="regName" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500 font-medium" placeholder="First Last Name">
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1 tracking-wider">Contact Number / Email</label>
          <input type="text" id="regContact" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500 font-medium" placeholder="8274940238">
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-slate-400 mb-1 tracking-wider">Create Access Password</label>
          <input type="password" id="regPass" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-orange-500 font-mono" placeholder="••••••••">
        </div>
        <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg uppercase tracking-widest text-xs transition-colors shadow-lg cursor-pointer">
          Submit Enrollment <i class="fa-solid fa-paper-plane ml-1"></i>
        </button>
      </form>

      <!-- Secure Admin Gate -->
      <form id="adminForm" onsubmit="handleAdminLogin(event)" class="space-y-4 hidden">
        <div class="bg-amber-950/30 border border-amber-800/40 p-3 rounded-lg text-xs text-amber-300 flex items-center gap-2">
          <i class="fa-solid fa-shield-halved text-amber-500 text-base"></i>
          <span>Restricted Portal for Director Chanchal Ghosh.</span>
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-amber-400 mb-1 tracking-wider">Admin ID</label>
          <input type="text" id="adminUsername" required class="w-full bg-slate-950 border border-amber-900/60 rounded-lg px-4 py-2.5 text-sm text-amber-100 focus:outline-none focus:border-amber-500 font-mono" placeholder="Money">
        </div>
        <div>
          <label class="block text-[10px] font-extrabold uppercase text-amber-400 mb-1 tracking-wider">Security Password</label>
          <input type="password" id="adminPassword" required class="w-full bg-slate-950 border border-amber-900/60 rounded-lg px-4 py-2.5 text-sm text-amber-100 focus:outline-none focus:border-amber-500 font-mono" placeholder="Money@220077">
        </div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 rounded-lg uppercase tracking-widest text-xs transition-colors shadow-lg cursor-pointer">
          Unlock Executive Dashboard <i class="fa-solid fa-key ml-1"></i>
        </button>
      </form>

    </div>

    <!-- Links Footer -->
    <div class="mt-6 text-center text-xs text-slate-500 font-semibold flex justify-between items-center px-2">
      <span>Official Portal System &copy; 2026</span>
      <a href="main.html" class="text-orange-400 hover:underline flex items-center gap-1 font-bold">
        Public Portal <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>

  </div>

  <script>
    const USER_KEY = 'meera_smriti_org_user';
    const REG_STORAGE = 'meera_smriti_registrations';
    const ADMIN_AUTH_KEY = 'meera_smriti_admin_auth';

    function switchTab(tab) {
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      const adminForm = document.getElementById('adminForm');
      
      const tabLoginBtn = document.getElementById('tabLoginBtn');
      const tabRegisterBtn = document.getElementById('tabRegisterBtn');
      const tabAdminBtn = document.getElementById('tabAdminBtn');

      loginForm.classList.add('hidden');
      regForm.classList.add('hidden');
      adminForm.classList.add('hidden');

      tabLoginBtn.className = "py-2.5 rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer";
      tabRegisterBtn.className = "py-2.5 rounded-lg text-slate-400 hover:text-white transition-all cursor-pointer";
      tabAdminBtn.className = "py-2.5 rounded-lg text-amber-500 hover:text-amber-400 transition-all cursor-pointer";

      if(tab === 'login') {
        loginForm.classList.remove('hidden');
        tabLoginBtn.className = "py-2.5 rounded-lg text-white bg-orange-600 transition-all cursor-pointer";
      } else if(tab === 'register') {
        regForm.classList.remove('hidden');
        tabRegisterBtn.className = "py-2.5 rounded-lg text-white bg-orange-600 transition-all cursor-pointer";
      } else if(tab === 'admin') {
        adminForm.classList.remove('hidden');
        tabAdminBtn.className = "py-2.5 rounded-lg text-slate-950 bg-amber-500 font-bold transition-all cursor-pointer";
      }
    }

    function handleUserLogin(e) {
      e.preventDefault();
      const val = document.getElementById('loginUser').value;
      const user = { name: val.split('@')[0], email: val, avatar: val.charAt(0).toUpperCase() };
      localStorage.setItem(USER_KEY, JSON.stringify(user));
      window.location.href = 'main.html';
    }

    function handleUserRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const contact = document.getElementById('regContact').value;
      const newUser = { name, email: contact, avatar: name.charAt(0).toUpperCase(), date: new Date().toLocaleDateString() };
      
      let existing = JSON.parse(localStorage.getItem(REG_STORAGE) || '[]');
      existing.push(newUser);
      localStorage.setItem(REG_STORAGE, JSON.stringify(existing));
      localStorage.setItem(USER_KEY, JSON.stringify(newUser));
      
      alert('Registration Recorded Successfully! Entering Main Dashboard...');
      window.location.href = 'main.html';
    }

    function handleAdminLogin(e) {
      e.preventDefault();
      const u = document.getElementById('adminUsername').value;
      const p = document.getElementById('adminPassword').value;

      if(u === 'Money' && p === 'Money@220077') {
        localStorage.setItem(ADMIN_AUTH_KEY, 'true');
        window.location.href = 'admin.html';
      } else {
        alert('Authentication Failed: Invalid Administrator Credentials.');
      }
    }
  </script>
</body>
</html>
