<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login | Meera Smriti Academy</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font-main: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 10% 20%, rgba(122, 28, 28, 0.08) 0%, rgba(248, 250, 252, 1) 90%);
    }

    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      position: relative;
    }

    .login-wrapper::before {
      content: '';
      position: absolute;
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, rgba(122, 28, 28, 0.25), rgba(245, 158, 11, 0.2));
      filter: blur(80px);
      border-radius: 50%;
      z-index: 0;
      top: 15%;
      left: calc(50% - 280px);
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      padding: 2.75rem 2.25rem;
      box-shadow: 0 20px 40px -15px rgba(122, 28, 28, 0.12), 0 0 0 1px rgba(0, 0, 0, 0.04);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 48px -12px rgba(122, 28, 28, 0.16), 0 0 0 1px rgba(0, 0, 0, 0.04);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo-ring {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, #7a1c1c 0%, #4a1010 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 1.75rem;
      font-weight: 800;
      box-shadow: 0 8px 16px -4px rgba(122, 28, 28, 0.3);
      position: relative;
    }

    .brand-logo-ring::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 19px;
      background: linear-gradient(135deg, var(--accent), transparent);
      z-index: -1;
      opacity: 0.7;
    }

    .login-header h2 {
      font-size: 1.65rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .login-header p {
      color: #64748b;
      font-size: 0.9rem;
      margin-top: 0.35rem;
    }

    .input-group {
      margin-bottom: 1.35rem;
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.825rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #334155;
      margin-bottom: 0.45rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .custom-input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #0f172a;
      background: #f8fafc;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .custom-input:focus {
      outline: none;
      background: #ffffff;
      border-color: #7a1c1c;
      box-shadow: 0 0 0 4px rgba(122, 28, 28, 0.1);
    }

    .custom-input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: #7a1c1c;
    }

    .btn-submit-peak {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, #7a1c1c 0%, #5c1414 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.975rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(122, 28, 28, 0.25);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.75rem;
    }

    .btn-submit-peak:hover {
      background: linear-gradient(135deg, #621616 0%, #481010 100%);
      box-shadow: 0 6px 18px rgba(122, 28, 28, 0.35);
      transform: translateY(-1px);
    }

    .btn-submit-peak:active {
      transform: translateY(0);
    }

    #loginAlert {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    #loginAlert.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    #loginAlert.success {
      display: block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .login-footer-meta {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.825rem;
    }

    .login-footer-meta a {
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .login-footer-meta a:hover {
      color: #7a1c1c;
    }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: #059669;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-badge">M</div>
        <span>Meera Smriti Academy</span>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="notices.html">Notices</a></li>
          <li><a href="admission.html">Admission</a></li>
          <li><a href="contacts.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-logo-ring">M</div>
        <h2>Portal Login</h2>
        <p>Access school management & administration</p>
      </div>

      <form id="loginForm">
        <div class="input-group">
          <label for="username">Username / ID</label>
          <div class="input-wrapper">
            <input type="text" id="username" class="custom-input" placeholder="e.g. admin_101" required autocomplete="username">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="custom-input" placeholder="••••••••" required autocomplete="current-password">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-submit-peak">
          <span>Sign In to Dashboard</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>
      </form>

      <div id="loginAlert"></div>

      <div class="login-footer-meta">
        <span class="secure-badge">
          <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5C2.056 5.649 2 6.319 2 7c0 5.225 3.34 9.67 8 11.317C14.66 16.67 18 12.225 18 7c0-.682-.057-1.35-.166-2A11.954 11.954 0 0110 1.944zM11 14a1 1 0 11-2 0 1 1 0 012 0zm0-7a1 1 0 10-2 0v3a1 1 0 102 0V7z" clip-rule="evenodd"></path>
          </svg>
          Encrypted
        </span>
        <a href="index.html">&larr; Back to Main Website</a>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-container">
      <p>&copy; Meera Smriti Academy. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
