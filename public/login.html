<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login | Meera Smriti Academy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="brand">
        <div class="brand-badge">M</div>
        <span>Meera Smriti Academy</span>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="notices.html">Notices</a></li>
          <li><a href="admission.html">Admission</a></li>
          <li><a href="contacts.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main style="display: flex; justify-content: center; align-items: center; padding: 3rem 1rem;">
    <div class="card" style="width: 100%; max-width: 420px;">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div class="brand-badge" style="margin: 0 auto 0.75rem auto; width: 48px; height: 48px; font-size: 1.25rem;">M</div>
        <h2>Portal Login</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in to access admin and management features</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username / ID</label>
          <input type="text" id="username" class="form-control" required placeholder="Enter your ID">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-login" style="width: 100%; text-align: center;">Sign In</button>
      </form>
      <div id="loginAlert" style="margin-top: 1rem; color: #dc2626; font-size: 0.875rem; text-align: center;"></div>
    </div>
  </main>

  <footer>
    <div class="footer-container">
      <p>&copy; Meera Smriti Academy. All rights reserved.</p>
    </div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
