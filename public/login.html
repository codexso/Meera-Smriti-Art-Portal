<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Access</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 380px;">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="font-weight: 800; font-size: 1.5rem;">MEERA SMRITI</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Secure Authentication</p>
        </div>
        <form id="loginForm">
            <div class="input-group"><input type="text" id="username" placeholder="Admin ID" required></div>
            <div class="input-group"><input type="password" id="password" placeholder="Password" required></div>
            <button type="submit" class="btn btn-accent">Authenticate</button>
        </form>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
