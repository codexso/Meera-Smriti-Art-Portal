<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Academy | Meera Smriti Siksha Kendra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    if (!localStorage.getItem('token')) {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

  <!-- HEADER -->
  <header class="bg-slate-950/90 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="main.html" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-orange-600 flex items-center justify-center font-bold text-white text-xs">MS</div>
        <span class="font-bold text-sm uppercase text-white">Meera Smriti <span class="text-orange-500">Siksha Kendra</span></span>
      </a>
      <a href="main.html" class="text-xs font-mono text-orange-400 hover:text-orange-300 flex items-center gap-1">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> Dashboard
      </a>
    </div>
  </header>

  <!-- CONTACT SECTION -->
  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow space-y-8 w-full">
    <div class="border-b border-slate-800 pb-4 text-center">
      <span class="text-xs font-mono text-orange-400 uppercase tracking-wider">Help & Admissions</span>
      <h2 class="text-2xl sm:text-3xl font-black uppercase text-white">Academy Contact Desk</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
        <h3 class="text-base font-bold text-white uppercase border-b border-slate-800 pb-2">Information</h3>
        <div class="space-y-3 text-xs font-mono text-slate-300">
          <p><i class="fa-solid fa-envelope text-orange-500 w-6"></i> admissions@meerasmriti.org</p>
          <p><i class="fa-solid fa-phone text-orange-500 w-6"></i> +91 98765 43210</p>
          <p><i class="fa-solid fa-clock text-orange-500 w-6"></i> Sat & Sun (8:00 AM - 6:00 PM)</p>
          <p><i class="fa-solid fa-location-dot text-orange-500 w-6"></i> Academy Campus, Fine Arts Wing</p>
        </div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
        <h3 class="text-base font-bold text-white uppercase border-b border-slate-800 pb-2">Send Inquiry</h3>
        <form onsubmit="event.preventDefault(); alert('Inquiry submitted!');" class="space-y-3">
          <input type="text" placeholder="Your Name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:border-orange-500 focus:outline-none">
          <textarea placeholder="Message / Query" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white focus:border-orange-500 focus:outline-none"></textarea>
          <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold text-xs py-2.5 rounded-xl uppercase tracking-wider transition-all">Submit Inquiry</button>
        </form>
      </div>

    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs font-mono text-slate-500">
    Meera Smriti Sishu Ankan Siksha Kendra &copy; 2026
  </footer>
</body>
</html>
