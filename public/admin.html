<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Meera Smriti</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Inter',sans-serif; background:#f4f4f9; margin:0; padding:40px; color:#333;}
  .container{max-width:800px; margin:0 auto; background:#fff; padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,0.08);}
  h1{font-size:24px; color:#1a202c; margin-bottom:10px;}
  p{color:#718096; margin-bottom:20px;}
  .card{background:#f7fafc; padding:20px; border-radius:12px; margin-bottom:20px; border-left:4px solid #23a6d5;}
  input{padding:10px; width:70%; border:1px solid #cbd5e0; border-radius:8px; font-size:14px;}
  button{padding:10px 20px; background:#23a6d5; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600;}
  .logout{background:#e53e3e; margin-top:20px;}
</style>
</head>
<body>
<div class="container">
  <h1>Admin Control Panel</h1>
  <p>Secure session verified successfully.</p>
  
  <div class="card">
    <h3>Soham License Lookup Module</h3>
    <p style="font-size:13px; margin:5px 0 15px 0;">Test verification system (e.g. SOHAM-2026-001)</p>
    <input type="text" id="licenseBox" placeholder="Enter license number...">
    <button onclick="verifyLicense()">Check</button>
    <div id="licenseResult" style="margin-top:10px; font-weight:600; font-size:14px;"></div>
  </div>

  <button class="logout" onclick="logout()">Log Out</button>
</div>

<script>
  if (!sessionStorage.getItem('ms_admin_token')) {
    window.location.href = 'index.html';
  }

  async function verifyLicense() {
    const licenseNumber = document.getElementById('licenseBox').value.trim();
    const res = await fetch('/api/verify-license', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ licenseNumber })
    });
    const data = await res.json();
    const resultEl = document.getElementById('licenseResult');
    if (data.success) {
      resultEl.style.color = '#38a169';
      resultEl.textContent = `Verified: ${data.student} — Status: ${data.status}`;
    } else {
      resultEl.style.color = '#e53e3e';
      resultEl.textContent = data.error;
    }
  }

  function logout() {
    sessionStorage.removeItem('ms_admin_token');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
