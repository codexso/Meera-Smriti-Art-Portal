<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | Meera Smriti Siksha Kendra</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    if (!localStorage.getItem('token')) {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

  <!-- HEADER -->
  <header class="bg-slate-950/90 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="main.html" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center font-bold text-slate-950 text-xs">AD</div>
        <span class="font-bold text-sm uppercase text-white">Meera Smriti <span class="text-amber-400">Admin Control</span></span>
      </a>
      <a href="main.html" class="text-xs font-mono text-orange-400 hover:text-orange-300 flex items-center gap-1">
        <i class="fa-solid fa-arrow-left text-[10px]"></i> Dashboard
      </a>
    </div>
  </header>

  <!-- ADMIN CONTENT -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow space-y-8 w-full">
    <div class="border-b border-slate-800 pb-4 flex items-center justify-between">
      <div>
        <span class="text-xs font-mono text-amber-400 uppercase tracking-wider">System Management</span>
        <h2 class="text-2xl sm:text-3xl font-black uppercase text-white">Student Registration Desk</h2>
      </div>
      <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-mono px-3 py-1 rounded-full">
        MongoDB Live
      </span>
    </div>

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-4">
      <h3 class="text-sm font-bold text-white uppercase font-mono">Current Session User Data</h3>
      <div id="userDataContainer" class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-xs font-mono text-slate-300 space-y-1">
        Loading admin profile...
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 py-6 text-center text-xs font-mono text-slate-500">
    Meera Smriti Sishu Ankan Siksha Kendra &copy; 2026
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const container = document.getElementById('userDataContainer');
    if (user.email) {
      container.innerHTML = `
        <p><strong class="text-white">Active Name:</strong> ${user.name || 'N/A'}</p>
        <p><strong class="text-white">Active Email:</strong> ${user.email}</p>
        <p><strong class="text-white">Role:</strong> ${user.role || 'student'}</p>
      `;
    } else {
      container.innerText = 'No session data found.';
    }
  </script>
</body>
</html>
