<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header" style="border-bottom-color: var(--accent);">
        <h2 style="color: var(--accent);">⚙️ OVERSEER ADMIN</h2>
        <div class="social-links">
            <a href="index.html">View Live Site</a>
            <button onclick="logout()" style="background: transparent; border: none; color: var(--danger); cursor: pointer;">Logout</button>
        </div>
    </header>

    <div class="container" style="max-width: 1200px; grid-template-columns: 1fr;">
        
        <!-- Stats Row -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div class="card" style="text-align: center;">
                <p style="color: var(--text-muted);">Total Site Visitors</p>
                <h2 id="statTraffic" style="font-size: 3rem; color: var(--accent);">0</h2>
            </div>
            <div class="card" style="text-align: center;">
                <p style="color: var(--text-muted);">Registered Students</p>
                <h2 id="statAdmissions" style="font-size: 3rem;">0</h2>
            </div>
            <div class="card" style="text-align: center;">
                <p style="color: var(--text-muted);">Server Uptime (Mins)</p>
                <h2 id="statUptime" style="font-size: 3rem; color: var(--success);">0</h2>
            </div>
        </div>

        <!-- Student Roster -->
        <div class="card">
            <div class="card-header">Active Student Roster</div>
            <ul class="list" id="dbList">
                <p style="color: var(--text-muted); text-align: center;">Loading secure records...</p>
            </ul>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
