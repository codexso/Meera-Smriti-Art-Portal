<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Meera Smriti Sishu Ankan Siksha Kendra</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    ink: '#2B2418', paper: '#FFF9EF', paperDeep: '#FBF1DE',
    saffron: '#E8A33D', teal: '#1B7A72', coral: '#D8553D'
  }, fontFamily: { display: ['"Baloo 2"', 'sans-serif'] } } } }
</script>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { background: #FFF9EF; font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Baloo 2', sans-serif; }
  select.status-select { appearance: none; }
</style>
</head>
<body class="min-h-screen text-ink">
  <header class="bg-white border-b-2 border-ink/10 px-6 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-teal text-white flex items-center justify-center font-display font-bold text-sm">म</div>
      <span class="font-display font-semibold text-sm">Admin Dashboard</span>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <span id="whoami" class="text-ink/60"></span>
      <span id="admission-pill" class="px-3 py-1 rounded-full text-xs font-display font-semibold"></span>
      <button id="logout-btn" class="px-4 py-2 rounded-lg bg-coral text-white font-display font-semibold text-xs">Log Out</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="font-display text-2xl font-bold">Admission Enquiries</h1>
        <p class="text-ink/60 text-sm">Every enquiry submitted from the homepage form lands here.</p>
        <p id="mail-status" class="text-xs mt-1"></p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/api/admin/enquiries/export" class="px-4 py-2 rounded-lg bg-teal text-white font-display font-semibold text-xs inline-flex items-center gap-2">
          <i class="fa-solid fa-file-csv"></i> Export CSV
        </a>
        <button id="refresh-btn" class="px-4 py-2 rounded-lg bg-paperDeep text-ink font-display font-semibold text-xs">
          <i class="fa-solid fa-rotate"></i> Refresh
        </button>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 mb-6">
      <input id="search-input" type="text" placeholder="Search by name, phone or message..."
        class="flex-1 min-w-[220px] bg-white border border-ink/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal">
      <select id="status-filter" class="bg-white border border-ink/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-teal">
        <option value="all">All statuses</option>
        <option value="new">New</option>
        <option value="contacted">Contacted</option>
        <option value="enrolled">Enrolled</option>
        <option value="closed">Closed</option>
      </select>
    </div>

    <div id="empty-state" class="hidden bg-white rounded-2xl p-10 text-center shadow-[4px_4px_0_0_#2B2418]">
      <p class="text-ink/60 text-sm">No enquiries match your search.</p>
    </div>

    <div id="table-wrap" class="bg-white rounded-2xl overflow-hidden shadow-[4px_4px_0_0_#2B2418]">
      <table class="w-full text-sm">
        <thead class="bg-paperDeep text-left">
          <tr>
            <th class="px-5 py-3 font-display font-semibold text-xs uppercase tracking-wide">Photo</th>
            <th class="px-5 py-3 font-display font-semibold text-xs uppercase tracking-wide">Parent</th>
            <th class="px-5 py-3 font-display font-semibold text-xs uppercase tracking-wide">Child</th>
            <th class="px-5 py-3 font-display font-semibold text-xs uppercase tracking-wide">Phone</th>
            <th class="px-5 py-3 font-display font-semibold text-xs uppercase tracking-wide">Message</th>
            <th class="px-5 py-3 font-display font-semibold text-xs uppercase tracking-wide">Submitted</th>
            <th class="px-5 py-3 font-display font-semibold text-xs uppercase tracking-wide">Status</th>
          </tr>
        </thead>
        <tbody id="enquiry-rows"></tbody>
      </table>
    </div>

    <div id="pagination" class="flex items-center justify-between mt-4 text-xs text-ink/60"></div>
  </main>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    fetch('/api/admin/me')
      .then(r => { if (!r.ok) throw new Error(); return r.json(); })
      .then(data => {
        document.getElementById('whoami').textContent = 'Signed in as ' + data.username;
        const mailStatus = document.getElementById('mail-status');
        mailStatus.textContent = data.emailNotificationsConfigured
          ? 'Email notifications: enabled'
          : 'Email notifications: not configured (set SMTP_* env vars)';
        mailStatus.className = 'text-xs mt-1 ' + (data.emailNotificationsConfigured ? 'text-teal' : 'text-ink/40');
      })
      .catch(() => { window.location.href = '/admin/login'; });

    fetch('/api/admission-status')
      .then(r => r.json())
      .then(data => {
        const pill = document.getElementById('admission-pill');
        if (data.open) {
          pill.textContent = 'Admissions Open';
          pill.className = 'px-3 py-1 rounded-full text-xs font-display font-semibold bg-teal/10 text-teal';
        } else {
          pill.textContent = 'Admissions Closed';
          pill.className = 'px-3 py-1 rounded-full text-xs font-display font-semibold bg-coral/10 text-coral';
        }
      });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    let currentPage = 1;
    const pageSize = 25;
    let searchDebounce = null;

    async function loadEnquiries() {
      const q = document.getElementById('search-input').value.trim();
      const status = document.getElementById('status-filter').value;

      const params = new URLSearchParams({ page: currentPage, pageSize });
      if (q) params.set('q', q);
      if (status && status !== 'all') params.set('status', status);

      const res = await fetch('/api/admin/enquiries?' + params.toString());
      if (!res.ok) return;
      const { enquiries, total } = await res.json();

      document.getElementById('empty-state').classList.toggle('hidden', enquiries.length !== 0);
      document.getElementById('table-wrap').classList.toggle('hidden', enquiries.length === 0);

      const rows = enquiries.map(e => `
        <tr class="border-t border-ink/5">
          <td class="px-5 py-3">
            ${e.photoUrl
              ? `<a href="${e.photoUrl}" target="_blank" rel="noopener"><img src="${e.photoUrl}" class="w-12 h-12 rounded-lg object-cover border border-ink/10" alt="Proof photo"></a>`
              : `<span class="w-12 h-12 rounded-lg bg-paperDeep flex items-center justify-center text-ink/20 text-xs">&mdash;</span>`}
          </td>
          <td class="px-5 py-3">${escapeHtml(e.parentName)}</td>
          <td class="px-5 py-3">${escapeHtml(e.childName)}</td>
          <td class="px-5 py-3">${escapeHtml(e.phone)}</td>
          <td class="px-5 py-3 max-w-[220px] truncate" title="${escapeHtml(e.message)}">${escapeHtml(e.message) || '&mdash;'}</td>
          <td class="px-5 py-3 text-ink/60 text-xs">${new Date(e.submittedAt).toLocaleString()}</td>
          <td class="px-5 py-3">
            <select data-id="${e.id}" class="status-select text-xs border border-ink/15 rounded-lg px-2 py-1 bg-paperDeep">
              ${['new','contacted','enrolled','closed'].map(s => `<option value="${s}" ${s === e.status ? 'selected' : ''}>${s}</option>`).join('')}
            </select>
          </td>
        </tr>
      `).join('');

      document.getElementById('enquiry-rows').innerHTML = rows;

      document.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', async (e) => {
          await fetch('/api/admin/enquiries/' + e.target.dataset.id, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: e.target.value })
          });
        });
      });

      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = `
        <span>${total} enquir${total === 1 ? 'y' : 'ies'} &middot; page ${currentPage} of ${totalPages}</span>
        <div class="flex gap-2">
          <button id="prev-page" class="px-3 py-1.5 rounded-lg bg-white border border-ink/10 ${currentPage <= 1 ? 'opacity-40 cursor-not-allowed' : ''}" ${currentPage <= 1 ? 'disabled' : ''}>Previous</button>
          <button id="next-page" class="px-3 py-1.5 rounded-lg bg-white border border-ink/10 ${currentPage >= totalPages ? 'opacity-40 cursor-not-allowed' : ''}" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>
        </div>
      `;
      document.getElementById('prev-page').addEventListener('click', () => { if (currentPage > 1) { currentPage--; loadEnquiries(); } });
      document.getElementById('next-page').addEventListener('click', () => { if (currentPage < totalPages) { currentPage++; loadEnquiries(); } });
    }

    document.getElementById('refresh-btn').addEventListener('click', () => { currentPage = 1; loadEnquiries(); });
    document.getElementById('status-filter').addEventListener('change', () => { currentPage = 1; loadEnquiries(); });
    document.getElementById('search-input').addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => { currentPage = 1; loadEnquiries(); }, 300);
    });

    loadEnquiries();
  </script>
</body>
</html>
